---
- name: Ensure Docker apt keyring directory exists
  ansible.builtin.file:
    path: "{{ docker_keyring_dir }}"
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_gpg_key_url }}"
    dest: /tmp/docker.gpg
    mode: '0644'
    force: false

- name: Add Docker GPG key to apt keyring
  ansible.builtin.command:
    cmd: "gpg --dearmor -o {{ docker_keyring_path }} /tmp/docker.gpg"
    creates: "{{ docker_keyring_path }}"

- name: Ensure Docker GPG keyring has correct permissions
  ansible.builtin.file:
    path: "{{ docker_keyring_path }}"
    state: file
    mode: '0644'

- name: Remove temporary Docker GPG key file
  ansible.builtin.file:
    path: /tmp/docker.gpg
    state: absent

- name: Discover Docker repository architecture
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: docker_arch
  changed_when: false

- name: Discover Ubuntu codename for Docker repository
  ansible.builtin.command:
    cmd: lsb_release -cs
  register: docker_ubuntu_codename
  changed_when: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_arch.stdout }} signed-by={{ docker_keyring_path }}] https://download.docker.com/linux/ubuntu {{ docker_ubuntu_codename.stdout }} stable"
    filename: "{{ docker_repo_filename }}"
    state: present
    update_cache: true

- name: Install Docker Engine packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd:
    name: "{{ docker_service_name }}"
    enabled: true
    state: started