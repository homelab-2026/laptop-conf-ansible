---
- name: Check if Docker GPG key is already present
  ansible.builtin.command:
    cmd: gpg --list-keys --keyring "{{ docker_keyring_path }}"
  register: docker_gpg_key_check
  changed_when: false
  failed_when: false

- name: Ensure Docker apt keyrings directory exists
  ansible.builtin.file:
    path: "{{ docker_keyring_dir }}"
    state: directory
    mode: '0755'
  when: not docker_gpg_key_check.stdout

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_gpg_key_url }}"
    dest: /tmp/docker.gpg
    mode: '0644'
  when: not docker_gpg_key_check.stdout

- name: Add Docker GPG key to apt keyring
  ansible.builtin.command:
    cmd: gpg --dearmor -o "{{ docker_keyring_path }}" /tmp/docker.gpg
    creates: "{{ docker_keyring_path }}"
  when: not docker_gpg_key_check.stdout

- name: Ensure Docker GPG key is readable by apt
  ansible.builtin.file:
    path: "{{ docker_keyring_path }}"
    state: file
    mode: '0644'
  when: not docker_gpg_key_check.stdout

- name: Remove /tmp/docker.gpg
  ansible.builtin.file:
    path: /tmp/docker.gpg
    state: absent
  when: not docker_gpg_key_check.stdout

- name: Get system architecture for Docker repository
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: docker_arch
  changed_when: false

- name: Get Ubuntu codename for Docker repository
  ansible.builtin.command:
    cmd: lsb_release -cs
  register: docker_ubuntu_codename
  changed_when: false

- name: Remove old Docker apt source files if they conflict with the keyring configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/docker.sources
    - /etc/apt/sources.list.d/docker.list.save
    - /etc/apt/sources.list.d/docker.sources.save

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_arch.stdout }} signed-by={{ docker_keyring_path }}] https://download.docker.com/linux/ubuntu {{ docker_ubuntu_codename.stdout }} stable"
    filename: "{{ docker_repo_filename }}"
    state: present

- name: Update apt package index for Docker repository
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Docker Engine packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Ensure Docker service is enabled and started
  ansible.builtin.systemd:
    name: "{{ docker_service_name }}"
    enabled: true
    state: started

- name: Add current user to docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true